[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "overpaintai"
version = "0.1.0"
description = "Differentiable stroke-based rendering for AI artifact cleanup and digital art upscaling"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
{ name = "Author" }
]
keywords = [
"deep-learning",
"pytorch",
"neural-rendering",
"stroke-based-rendering",
"image-processing",
"upscaling"
]
dependencies = [
"torch>=2.0.0",
"torchvision>=0.15.0",
"pillow>=9.5.0",
"numpy",
]

[project.optional-dependencies]
dev = [
"pytest>=7.0.0",
"ruff",
"black",
]

[project.scripts]
overpaint-test = "overpaintai.scripts.test_engine:main"
overpaint-gui = "overpaintai.scripts.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"